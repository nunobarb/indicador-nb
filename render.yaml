services:
  - type: web
    name: indicador-nb
    runtime: python
    buildCommand: pip install -r requirements_backend.txt
    startCommand: gunicorn backend_api:app --timeout 120
    autoDeploy: true
    envVars:
      - key: FRED_KEY
        sync: false
      - key: ALERT_SMTP_HOST
        sync: false
      - key: ALERT_SMTP_PORT
        sync: false
      - key: ALERT_SMTP_USER
        sync: false
      - key: ALERT_SMTP_PASS
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
      # Alinhados com as zonas visuais do contrarian_web_app.html (v3):
      # score <=45 = "Compra" · score >82 = "Vender" · bust score >=70 = zona de risco alto
      - key: ALERT_BUY_THRESHOLD
        value: "45"
      - key: ALERT_SELL_THRESHOLD
        value: "82"
      - key: ALERT_BUST_THRESHOLD
        value: "70"

  # Cron = trigger simples + keep-alive (evita cold starts no free tier).
  # Toda a lógica de score e envio de email vive agora no web service.
  - type: cron
    name: indicador-nb-alerter
    runtime: python
    schedule: "*/30 * * * *"
    buildCommand: pip install requests
    startCommand: python alerter.py
    envVars:
      - key: ALERT_API_URL
        value: "https://indicador-nb.onrender.com/api/data"
